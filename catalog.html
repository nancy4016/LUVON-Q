<!DOCTYPE html>
<html lang="en" class="h-full bg-[#fbf9f5]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVON Q | Catalog & Stock Manager</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcfaf6',
              100: '#f5eee1',
              200: '#e7e2d8',
              500: '#a38446',
              600: '#8c7038',
              700: '#735b2c',
              900: '#1c1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>

  <style>
    svg.lucide, i[data-lucide] svg {
      display: inline-block !important;
      vertical-align: middle !important;
      stroke-width: 2 !important;
    }
    i[data-lucide] {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #fbf9f5; }
    ::-webkit-scrollbar-thumb { background: #e7e2d8; border-radius: 9999px; }
  </style>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row overflow-x-hidden font-sans">

  <!-- Mobile Top Nav -->
  <header class="md:hidden bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30 w-full">
    <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-10 w-auto object-contain" />
    <button type="button" onclick="toggleMobileMenu()" class="p-2 text-slate-700 hover:text-brand-600 focus:outline-none cursor-pointer">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
  </header>

  <div id="sidebarBackdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Unified Sidebar Navigation Drawer -->
  <aside id="sidebarNav" class="fixed top-0 left-0 bottom-0 z-50 w-72 bg-white/95 backdrop-blur-md border-r border-brand-200/50 flex flex-col justify-between p-6 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:w-64 flex-shrink-0">
    <div class="space-y-8">
      <div class="flex items-center justify-between">
        <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-12 w-auto object-contain" />
        <button type="button" onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <nav class="space-y-1">
        <a href="index.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
        </a>
        <a href="catalog.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg bg-brand-100 text-brand-900 font-semibold transition-all text-sm">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> Catalog & Stock
        </a>
        <a href="inbox.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="message-square" class="w-4 h-4"></i> Omnichannel Inbox
        </a>
        <a href="voice.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="mic" class="w-4 h-4"></i> Voice & Persona
        </a>
        <a href="payments.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="credit-card" class="w-4 h-4"></i> Daraja M-Pesa
        </a>
        <a href="settings.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="settings" class="w-4 h-4"></i> Settings
        </a>
      </nav>
    </div>

    <div class="pt-6 border-t border-brand-200/60">
      <button id="portalSignInBtn" onclick="openSignInModal()" class="w-full p-3 bg-brand-600 text-white rounded-xl flex items-center justify-center gap-2 font-medium text-sm shadow-md hover:bg-brand-700 transition-all cursor-pointer">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Sign In to Portal</span>
      </button>
      <div id="activeTenantCard" class="hidden p-3 bg-brand-50 rounded-xl border border-brand-200 flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">LQ</div>
          <div class="overflow-hidden">
            <p class="text-xs font-semibold text-brand-900 truncate" id="tenantName">Loading...</p>
            <span class="inline-block px-1.5 py-0.5 text-[10px] font-semibold text-emerald-700 bg-emerald-100 rounded">Active Merchant</span>
          </div>
        </div>
        <button onclick="toggleSignOut()" class="text-slate-400 hover:text-rose-600 p-1 cursor-pointer" title="Sign Out">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 w-full p-4 md:p-8 overflow-y-auto space-y-6">    
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-brand-200 pb-6">
      <div>
        <h1 class="text-2xl font-serif font-bold text-brand-900">Live Inventory & Catalog Manager</h1>
        <p class="text-xs text-slate-500 mt-1">Manage stock availability and products synced to conversational AI agents</p>
      </div>
      <button id="open-modal-btn" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold shadow transition-all flex items-center gap-2 cursor-pointer">
        <i data-lucide="plus" class="w-4 h-4"></i> Add New Product
      </button>
    </header>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="relative w-full sm:w-80">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
        <input type="text" id="catalog-search" placeholder="Search catalog items..." class="w-full pl-10 pr-4 py-2.5 text-xs bg-white border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 shadow-sm" />
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto">
        <select id="category-filter" class="w-full sm:w-auto px-4 py-2.5 text-xs bg-white border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 font-medium text-brand-900 shadow-sm">
          <option value="ALL">All Categories</option>
          <option value="Sneakers">Sneakers</option>
          <option value="Salon">Salon</option>
          <option value="Boutique">Boutique</option>
          <option value="Spa">Spa</option>
          <option value="Apparel">Apparel</option>
          <option value="Wellness">Wellness</option>
        </select>
      </div>
    </div>

    <!-- Product Grid / Table -->
    <div class="bg-white rounded-xl border border-brand-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-brand-50 border-b border-brand-200 font-semibold text-brand-900 uppercase tracking-wider">
            <tr>
              <th class="p-4">Item</th>
              <th class="p-4">Category</th>
              <th class="p-4">Price (KSh)</th>
              <th class="p-4">Stock Count</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="catalog-table-body" class="divide-y divide-brand-200/60">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Product Modal Overlay -->
  <div id="product-modal" class="fixed inset-0 z-50 hidden bg-brand-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-brand-200 max-w-lg w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in duration-200">
      <div class="flex items-center justify-between border-b border-brand-200 pb-4">
        <h3 class="font-serif font-bold text-lg text-brand-900">Add New Catalog Item</h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-brand-900 transition-colors cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="product-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-brand-900 mb-1">Item Name</label>
          <input type="text" id="prod-name" required placeholder="e.g. Air Force 1 White" class="w-full px-4 py-2.5 text-xs bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 font-medium" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-brand-900 mb-1">Price (KSh)</label>
            <input type="number" id="prod-price" required placeholder="2500" class="w-full px-4 py-2.5 text-xs bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 font-medium" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-brand-900 mb-1">In Stock Quantity</label>
            <input type="number" id="prod-stock" required placeholder="5" class="w-full px-4 py-2.5 text-xs bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 font-medium" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-900 mb-1">Category</label>
          <select id="prod-category" class="w-full px-4 py-2.5 text-xs bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 font-medium text-brand-900">
            <option value="Sneakers">Sneakers</option>
            <option value="Salon">Salon</option>
            <option value="Boutique">Boutique</option>
            <option value="Spa">Spa</option>
            <option value="Apparel">Apparel</option>
            <option value="Wellness">Wellness</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-900 mb-1">Image URL (Optional)</label>
          <input type="url" id="prod-image" placeholder="https://images.unsplash.com/..." class="w-full px-4 py-2.5 text-xs bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600 font-medium" />
        </div>

        <div class="pt-4 flex items-center justify-end gap-3">
          <button type="button" id="cancel-modal-btn" class="px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-brand-50 rounded-xl transition-all cursor-pointer">Cancel</button>
          <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl shadow transition-all cursor-pointer">Save to Catalog</button>
        </div>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="catalog.js"></script>
  <script>
    function toggleMobileMenu() {
      const nav = document.getElementById("sidebarNav");
      const backdrop = document.getElementById("sidebarBackdrop");
      if (!nav || !backdrop) return;
      nav.classList.toggle("-translate-x-full");
      backdrop.classList.toggle("hidden");
    }

    function renderIcons() {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
      }
    }
    document.addEventListener("DOMContentLoaded", renderIcons);
    window.addEventListener("load", renderIcons);
    setTimeout(renderIcons, 250);
  </script>
</body>
</html>
