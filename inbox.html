<!DOCTYPE html>
<html lang="en" class="h-full bg-[#fbf9f5]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVON Q ORÉLUNE | Omnichannel Inbox</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind JavaScript Theme Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcfaf6',
              100: '#f5eee1',
              200: '#e7e2d8',
              500: '#a38446',
              600: '#8c7038',
              700: '#735b2c',
              900: '#1c1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- External Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- Mobile Top Navigation Header -->
  <header class="md:hidden bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30 w-full">
    <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-10 w-auto object-contain" />
    <button type="button" onclick="toggleMobileMenu()" class="p-2 text-slate-700 hover:text-brand-600 focus:outline-none cursor-pointer">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
  </header>

  <!-- Mobile Backdrop Overlay -->
  <div id="sidebarBackdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Sidebar Navigation Drawer -->
  <aside id="sidebarNav" class="fixed top-0 left-0 bottom-0 z-50 w-72 bg-white/95 backdrop-blur-md border-r border-brand-200/50 flex flex-col justify-between p-6 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:w-64 flex-shrink-0">
    <div class="space-y-8">
      <!-- Sidebar Header / Logo -->
      <div class="flex items-center justify-between">
        <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-12 w-auto object-contain" />
        <button type="button" onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1">
        <a href="index.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
        </a>
        <a href="catalog.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> Catalog & Stock
        </a>
        <a href="inbox.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg bg-brand-100 text-brand-900 font-semibold transition-all text-sm">
          <i data-lucide="message-square" class="w-4 h-4"></i> Omnichannel Inbox
        </a>
        <a href="voice.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="mic" class="w-4 h-4"></i> Voice & Persona
        </a>
        <a href="payments.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="credit-card" class="w-4 h-4"></i> Daraja M-Pesa
        </a>
      </nav>
    </div>

    <!-- Bottom Auth Access -->
    <div class="pt-6 border-t border-brand-200/60">
      <button id="portalSignInBtn" onclick="openSignInModal()" class="w-full p-3 bg-brand-600 text-white rounded-xl flex items-center justify-center gap-2 font-medium text-sm shadow-md hover:bg-brand-700 transition-all cursor-pointer">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Sign In to Portal</span>
      </button>
      <div id="activeTenantCard" class="hidden p-3 bg-brand-50 rounded-xl border border-brand-200 flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">LQ</div>
          <div class="overflow-hidden">
            <p class="text-xs font-semibold text-brand-900 truncate" id="tenantName">Luvon Q Flagship</p>
            <span class="inline-block px-1.5 py-0.5 text-[10px] font-semibold text-emerald-700 bg-emerald-100 rounded">Verified Provider</span>
          </div>
        </div>
        <button onclick="toggleSignOut()" class="text-slate-400 hover:text-rose-600 p-1 cursor-pointer">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Inbox Container (Split View) -->
  <main class="flex-1 flex flex-col md:flex-row h-screen overflow-hidden">    
    <!-- Left Pane: Conversation Threads -->
    <section class="w-full md:w-80 bg-white border-r border-brand-200 flex flex-col h-full flex-shrink-0">
      <div class="p-4 border-b border-brand-200 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-serif font-bold text-lg text-brand-900">Conversations</h2>
          <button onclick="fetchLiveConversations()" class="px-2 py-0.5 text-[10px] font-bold text-brand-700 bg-brand-100 hover:bg-brand-200 rounded-full transition-colors flex items-center gap-1 cursor-pointer">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Live Sync
          </button>
        </div>
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-3 text-slate-400"></i>
          <input 
            type="text" 
            id="search-input"
            oninput="handleSearch(this.value)"
            placeholder="Search phone or name..." 
            class="w-full pl-8 pr-3 py-2 text-xs bg-brand-50 border border-brand-200 rounded-lg focus:outline-none focus:border-brand-600" 
          />
        </div>
      </div>

      <!-- Thread Items List -->
      <div id="threads-container" class="flex-1 overflow-y-auto divide-y divide-brand-200/60">
        <!-- Rendered dynamically by inbox.js -->
      </div>
    </section>

    <!-- Right Pane: Live Chat Stream -->
    <section class="flex-1 flex flex-col h-full bg-[#fbf9f5] overflow-hidden">
      <!-- Chat Header Bar -->
      <div class="p-4 bg-white border-b border-brand-200 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
          <div id="active-avatar" class="w-10 h-10 rounded-full bg-brand-100 border border-brand-200 flex items-center justify-center font-bold text-brand-700 text-sm">
            C
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 id="active-name" class="font-bold text-sm text-brand-900">Customer</h3>
              <span id="active-channel-badge" class="px-2 py-0.5 text-[9px] font-extrabold uppercase rounded bg-emerald-100 text-emerald-800">WhatsApp</span>
            </div>
            <p id="active-phone" class="text-xs text-slate-500">Select thread</p>
          </div>
        </div>

        <!-- Controls & Stage Badge -->
        <div class="flex items-center gap-2.5">
          <span id="active-stage-badge" class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider rounded-md bg-amber-100 text-amber-800 border border-amber-200">
            QUALIFICATION
          </span>
          <button 
            id="ai-toggle-btn" 
            type="button" 
            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition-all flex items-center gap-1.5 shadow-sm cursor-pointer"
          >
            <i data-lucide="bot" class="w-3.5 h-3.5"></i>
            <span id="ai-toggle-label">AI Responding</span>
          </button>
        </div>
      </div>

      <!-- Chat Messages Stream Container (Fixed ID) -->
      <div id="chat-stream" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-4">
        <!-- Messages rendered dynamically by inbox.js -->
      </div>

      <!-- Chat Input Form & Action Bar -->
      <div class="p-4 bg-white border-t border-brand-200">
        <form id="chat-form" class="flex items-center gap-2" onsubmit="event.preventDefault(); handleSendMessage();">
          
          <!-- Quick STK Push Action Button -->
          <button 
            type="button" 
            id="quick-stk-btn"
            onclick="triggerQuickSTK()"
            title="Dispatch M-Pesa STK Push to this customer"
            class="p-2.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl hover:bg-emerald-100 transition-colors shadow-sm flex items-center gap-1.5 text-xs font-semibold cursor-pointer"
          >
            <i data-lucide="banknote" class="w-4 h-4"></i>
            <span class="hidden sm:inline">STK Push</span>
          </button>

          <!-- Input Box -->
          <input 
            type="text" 
            id="chat-input"
            autocomplete="off"
            placeholder="Type a message or trigger automated M-Pesa STK prompt..." 
            class="flex-1 px-4 py-2.5 bg-slate-50 border border-brand-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-brand-600 text-stone-900" 
          />

          <!-- Send Message Button -->
          <button 
            type="submit" 
            id="send-btn"
            title="Send WhatsApp Message"
            class="p-2.5 bg-brand-600 text-white rounded-xl hover:bg-brand-700 active:scale-95 transition-all shadow-sm flex items-center justify-center cursor-pointer flex-shrink-0"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Email/Password & Registration Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative border border-brand-100 animate-in fade-in zoom-in duration-200">
      
      <!-- Close Button -->
      <button type="button" onclick="closeSignInModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Modal Header -->
      <div class="text-center mb-4">
        <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-12 mx-auto mb-2 object-contain" />
        <h2 class="text-xl font-serif font-bold text-slate-900" id="authModalTitle">Sign in to Orélune OS</h2>
        <p class="text-xs text-slate-500 mt-1">Access developer sandboxes, M-Pesa test triggers & voice integration</p>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="flex border-b border-slate-100 mb-5 text-xs font-semibold">
        <button id="tabSignIn" type="button" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-center text-brand-600 border-b-2 border-brand-600 transition-all cursor-pointer">
          Sign In
        </button>
        <button id="tabSignUp" type="button" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition-all cursor-pointer">
          Create Account
        </button>
      </div>

      <!-- Authentication Form -->
      <form id="loginForm" onsubmit="handleCustomerAuth(event)" class="space-y-3.5">
        <div id="nameFieldGroup" class="hidden">
          <label for="fullName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name / Business Name</label>
          <input 
            type="text" 
            id="fullName" 
            placeholder="Nairobi Kicks Studio" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
          />
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="developer@studio.com" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
          />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
          />
        </div>

        <div id="signInOptions" class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
            <input type="checkbox" class="rounded border-slate-300 text-brand-600 focus:ring-brand-600" />
            <span>Remember me</span>
          </label>
          <a href="#" class="text-brand-600 hover:underline font-medium">Forgot password?</a>
        </div>

        <button 
          type="submit" 
          id="authSubmitBtn"
          class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium text-sm transition-all shadow-md shadow-brand-600/20 cursor-pointer mt-2"
        >
          Authenticate Session
        </button>
      </form>
    </div>
  </div>

  <!-- UI Action Script Helpers -->
  <script>
    function toggleMobileMenu() {
      const nav = document.getElementById("sidebarNav");
      const backdrop = document.getElementById("sidebarBackdrop");
      if (!nav || !backdrop) return;
      const isClosed = nav.classList.contains("-translate-x-full");
      if (isClosed) {
        nav.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        nav.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    function openSignInModal() {
      document.getElementById("authModal")?.classList.remove("hidden");
    }

    function closeSignInModal() {
      document.getElementById("authModal")?.classList.add("hidden");
    }

    function switchAuthTab(tab) {
      const nameGroup = document.getElementById("nameFieldGroup");
      const title = document.getElementById("authModalTitle");
      const submitBtn = document.getElementById("authSubmitBtn");
      const tabIn = document.getElementById("tabSignIn");
      const tabUp = document.getElementById("tabSignUp");

      if (tab === 'signup') {
        nameGroup?.classList.remove("hidden");
        if (title) title.textContent = "Create Orélune Account";
        if (submitBtn) submitBtn.textContent = "Register & Connect";
        tabUp?.classList.add("text-brand-600", "border-b-2", "border-brand-600");
        tabUp?.classList.remove("text-slate-400", "border-transparent");
        tabIn?.classList.remove("text-brand-600", "border-b-2", "border-brand-600");
        tabIn?.classList.add("text-slate-400", "border-transparent");
      } else {
        nameGroup?.classList.add("hidden");
        if (title) title.textContent = "Sign in to Orélune OS";
        if (submitBtn) submitBtn.textContent = "Authenticate Session";
        tabIn?.classList.add("text-brand-600", "border-b-2", "border-brand-600");
        tabIn?.classList.remove("text-slate-400", "border-transparent");
        tabUp?.classList.remove("text-brand-600", "border-b-2", "border-brand-600");
        tabUp?.classList.add("text-slate-400", "border-transparent");
      }
    }

    function handleCustomerAuth(e) {
      e.preventDefault();
      closeSignInModal();
      document.getElementById("portalSignInBtn")?.classList.add("hidden");
      document.getElementById("activeTenantCard")?.classList.remove("hidden");
    }

    function toggleSignOut() {
      document.getElementById("portalSignInBtn")?.classList.remove("hidden");
      document.getElementById("activeTenantCard")?.classList.add("hidden");
    }

    async function triggerQuickSTK() {
      const phoneEl = document.getElementById("active-phone");
      const phoneText = phoneEl ? phoneEl.textContent.replace(/[^0-9]/g, '') : '';
      
      if (!phoneText || phoneText.length < 9) {
        alert("Please select an active conversation thread first.");
        return;
      }

      const amount = prompt(`Enter M-Pesa amount in KSh to send STK push to +${phoneText}:`, "1");
      if (!amount) return;

      const btn = document.getElementById("quick-stk-btn");
      if (btn) btn.disabled = true;

      try {
        const res = await fetch(`${window.location.origin}/api/tenant/payments/test-stk`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-tenant-id': 'luvon_q_flagship'
          },
          body: JSON.stringify({ testPhone: phoneText })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`✅ STK Push dispatched to +${phoneText}! Check the device to enter M-Pesa PIN.`);
        } else {
          alert(`❌ STK Push error: ${data.message || 'Check Daraja credentials'}`);
        }
      } catch (err) {
        alert(`❌ Network error: ${err.message}`);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const items = document.querySelectorAll("#threads-container > div");
      items.forEach(el => {
        const text = el.innerText.toLowerCase();
        el.style.display = text.includes(q) ? "" : "none";
      });
    }
  </script>

  <!-- Shared API Bridge & Page Script -->
  <script src="api.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
