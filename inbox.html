<!DOCTYPE html>
<html lang="en" class="h-full bg-[#fcfaf6]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVON Q ORÉLUNE | Omnichannel Inbox</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind JavaScript Theme Configuration for Luvon Q -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcfaf6',
              100: '#f5eee1',
              200: '#e7e0d0',
              300: '#d5c4a1',
              400: '#bc9f67',
              500: '#a38446',
              600: '#8c7038',
              700: '#735b2c',
              800: '#4a3b1d',
              900: '#1c1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Custom Scrollbar for Luxury Aesthetic */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #fcfaf6;
    }
    ::-webkit-scrollbar-thumb {
      background: #e7e0d0;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #bc9f67;
    }
  </style>
</head>
<body class="bg-[#fcfaf6] text-stone-800 min-h-screen flex flex-col md:flex-row overflow-x-hidden font-sans">

  <!-- Mobile Top Header -->
  <header class="md:hidden bg-white/90 backdrop-blur-md border-b border-brand-200 p-4 flex items-center justify-between sticky top-0 z-30 w-full">
    <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-9 w-auto object-contain" />
    <button type="button" onclick="toggleMobileMenu()" class="p-2 text-stone-700 hover:text-brand-600 focus:outline-none cursor-pointer">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
  </header>

  <!-- Mobile Overlay -->
  <div id="sidebarBackdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-stone-900/40 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Sidebar Navigation Drawer -->
  <aside id="sidebarNav" class="fixed top-0 left-0 bottom-0 z-50 w-72 bg-white/95 backdrop-blur-md border-r border-brand-200/70 flex flex-col justify-between p-6 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:w-64 flex-shrink-0 shadow-sm md:shadow-none">
    <div class="space-y-8">
      <!-- Logo Header -->
      <div class="flex items-center justify-between">
        <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-11 w-auto object-contain" />
        <button type="button" onclick="toggleMobileMenu()" class="md:hidden text-stone-400 hover:text-stone-600 p-1 cursor-pointer">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1.5">
        <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-xs">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-brand-600"></i> Overview
        </a>
        <a href="catalog.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-xs">
          <i data-lucide="shopping-bag" class="w-4 h-4 text-brand-600"></i> Catalog & Stock
        </a>
        <a href="inbox.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-brand-100/70 text-brand-900 font-semibold border border-brand-200/50 shadow-sm transition-all text-xs">
          <i data-lucide="message-square" class="w-4 h-4 text-brand-700"></i> Omnichannel Inbox
        </a>
        <a href="voice.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-xs">
          <i data-lucide="mic" class="w-4 h-4 text-brand-600"></i> Voice & Persona
        </a>
        <a href="payments.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-xs">
          <i data-lucide="credit-card" class="w-4 h-4 text-brand-600"></i> Daraja M-Pesa
        </a>
      </nav>
    </div>

    <!-- Tenant Status Footer -->
    <div class="pt-6 border-t border-brand-200/60">
      <div id="activeTenantCard" class="p-3 bg-brand-50/80 rounded-xl border border-brand-200 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-8 h-8 rounded-lg bg-brand-700 text-white flex items-center justify-center font-serif font-bold text-xs flex-shrink-0 shadow-sm">LQ</div>
          <div class="overflow-hidden">
            <p class="text-xs font-bold text-brand-900 truncate">Luvon Q Flagship</p>
            <span class="inline-block px-1.5 py-0.2 text-[9px] font-bold text-emerald-800 bg-emerald-100 rounded">Verified Provider</span>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Inbox Layout -->
  <main class="flex-1 flex flex-col md:flex-row h-screen overflow-hidden">    
    
    <!-- Left Pane: Conversation Threads -->
    <section class="w-full md:w-80 bg-white border-r border-brand-200/70 flex flex-col h-full flex-shrink-0">
      <div class="p-4 border-b border-brand-200/70 space-y-3 bg-[#fdfcf9]">
        <div class="flex items-center justify-between">
          <h2 class="font-serif font-bold text-lg text-brand-900 tracking-tight">Conversations</h2>
          <div class="flex items-center gap-1.5">
            <button 
              id="test-inquiry-btn"
              onclick="triggerTestInquiryUI()" 
              type="button" 
              class="px-2.5 py-1 text-[11px] font-bold text-brand-900 bg-brand-100 hover:bg-brand-200 border border-brand-300 rounded-lg transition-all flex items-center gap-1.5 shadow-sm cursor-pointer"
            >
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-brand-700"></i> + Test Inquiry
            </button>
            <button 
              onclick="fetchLiveConversations()" 
              type="button" 
              class="p-1.5 text-stone-500 hover:text-brand-800 hover:bg-brand-50 border border-transparent hover:border-brand-200 rounded-lg transition-all cursor-pointer"
              title="Sync Conversations"
            >
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-3 text-brand-400"></i>
          <input 
            type="text" 
            id="search-input"
            oninput="handleSearch(this.value)"
            placeholder="Search phone or customer..." 
            class="w-full pl-8 pr-3 py-2 text-xs bg-brand-50/60 border border-brand-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-brand-500 text-stone-800 placeholder-stone-400 transition-all" 
          />
        </div>
      </div>

      <!-- Thread Items List -->
      <div id="threads-container" class="flex-1 overflow-y-auto divide-y divide-brand-100">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Right Pane: Live Chat Stream -->
    <section class="flex-1 flex flex-col h-full bg-[#fbf9f5] overflow-hidden">
      
      <!-- Top Chat Header -->
      <div class="p-4 bg-white border-b border-brand-200/70 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
          <div id="active-avatar" class="w-10 h-10 rounded-xl bg-brand-100 border border-brand-200 flex items-center justify-center font-serif font-bold text-brand-700 text-sm shadow-sm">
            LQ
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 id="active-name" class="font-bold text-sm text-stone-900">Test Customer</h3>
              <span id="active-channel-badge" class="px-2 py-0.5 text-[9px] font-extrabold uppercase rounded bg-emerald-100 text-emerald-800 border border-emerald-200">WhatsApp</span>
            </div>
            <p id="active-phone" class="text-xs text-stone-500 font-mono">+254768820142</p>
          </div>
        </div>

        <!-- Stage & AI Toggle Controls -->
        <div class="flex items-center gap-2.5">
          <span id="active-stage-badge" class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider rounded-lg bg-amber-100/80 text-amber-900 border border-amber-300">
            QUALIFICATION
          </span>
          <button 
            id="ai-toggle-btn" 
            type="button" 
            onclick="toggleAIPauseState()"
            class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-700 hover:bg-emerald-800 text-white transition-all flex items-center gap-1.5 shadow-sm cursor-pointer"
          >
            <i data-lucide="bot" class="w-3.5 h-3.5"></i>
            <span id="ai-toggle-label">AI Responding</span>
          </button>
        </div>
      </div>

      <!-- Chat Messages Container -->
      <div id="chat-stream" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-3.5 bg-[#fcfaf6]">
        <!-- Rendered dynamically -->
      </div>

      <!-- Chat Bottom Input Bar -->
      <div class="p-3.5 bg-white border-t border-brand-200/70 shadow-sm">
        <form id="chat-form" class="flex items-center gap-2" onsubmit="event.preventDefault(); handleSendMessage();">
          
          <!-- Quick STK Push Action Button -->
          <button 
            type="button" 
            id="quick-stk-btn"
            onclick="triggerQuickSTK()"
            title="Dispatch M-Pesa STK Push to this customer"
            class="px-3.5 py-2.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-xl hover:bg-emerald-100 transition-all shadow-sm flex items-center gap-1.5 text-xs font-bold cursor-pointer flex-shrink-0"
          >
            <i data-lucide="banknote" class="w-4 h-4 text-emerald-700"></i>
            <span class="hidden sm:inline">STK Push</span>
          </button>

          <!-- Input Field -->
          <input 
            type="text" 
            id="chat-input"
            autocomplete="off"
            placeholder="Type a message or reply to customer..." 
            class="flex-1 px-4 py-2.5 bg-[#fcfaf6] border border-brand-200 focus:border-brand-600 rounded-xl text-xs focus:outline-none text-stone-900 placeholder-stone-400 transition-all shadow-inner" 
          />

          <!-- Updated Send Button -->
          <button 
            type="submit" 
            id="send-btn"
            title="Send WhatsApp Message"
            class="p-2.5 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white rounded-xl transition-all shadow-md flex items-center justify-center cursor-pointer flex-shrink-0"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Complete In-Line Controller Script -->
  <script>
    let conversations = [];
    let activeConvId = "254768820142";
    let isSending = false;

    const BASE_ORIGIN = (window.location.origin && window.location.origin.includes('http'))
      ? window.location.origin
      : 'http://localhost:3000';
    const BACKEND_URL = `${BASE_ORIGIN}/api/tenant`;
    const TENANT_ID = 'luvon_q_flagship';

    // Default Seed Conversation
    function getStarterData() {
      return [{
        id: "254768820142",
        customerId: "254768820142",
        customerName: "Joel (Test Customer)",
        customerPhone: "+254768820142",
        channel: "whatsapp",
        stage: "QUALIFICATION",
        isPaused: false,
        messages: [
          {
            role: "user",
            text: "Niaje, do you have Air Force 1 White in stock?",
            timestamp: "01:15 AM"
          },
          {
            role: "assistant",
            text: "Niaje! Yes, we currently have 4 pairs of Air Force 1 White available for KSh 2,500. Would you like me to initiate an M-Pesa STK push for you?",
            timestamp: "01:15 AM"
          }
        ]
      }];
    }

    async function fetchLiveConversations() {
      try {
        const res = await fetch(`${BACKEND_URL}/conversations`, {
          headers: { 
            'Content-Type': 'application/json',
            'x-tenant-id': TENANT_ID 
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawChats = await res.json();

        if (Array.isArray(rawChats) && rawChats.length > 0) {
          conversations = rawChats.map((c, index) => {
            const cId = String(c.customerId || c.phone || `conv_${index}`);
            return {
              id: cId,
              customerId: cId,
              customerName: c.customerName || `Customer +${cId.replace(/^\+/, '')}`,
              customerPhone: cId.startsWith('+') ? cId : `+${cId}`,
              channel: c.channel || 'whatsapp',
              stage: c.stage || 'QUALIFICATION',
              isPaused: Boolean(c.isPaused),
              messages: (c.conversationHistory || c.messages || []).map(m => ({
                role: m.role === 'user' ? 'user' : 'assistant',
                text: m.text || m.body || '',
                timestamp: m.timestamp 
                  ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
                  : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              }))
            };
          });

          if (!activeConvId || !conversations.some(c => c.id === activeConvId)) {
            activeConvId = conversations[0].id;
          }
        } else {
          if (conversations.length === 0) {
            conversations = getStarterData();
            activeConvId = "254768820142";
          }
        }
      } catch (err) {
        console.warn('Using local starter conversation thread:', err.message);
        if (conversations.length === 0) {
          conversations = getStarterData();
          activeConvId = "254768820142";
        }
      }

      renderThreads();
      renderChatStream();
    }

    function renderThreads() {
      const container = document.getElementById("threads-container");
      if (!container) return;

      if (conversations.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-stone-400 text-xs">
            No active conversations. Click <b>+ Test Inquiry</b> above.
          </div>
        `;
        return;
      }

      container.innerHTML = conversations.map(c => {
        const lastMsg = c.messages[c.messages.length - 1];
        const isActive = c.id === activeConvId;

        return `
          <div onclick="selectConversation('${c.id}')" class="p-3.5 cursor-pointer hover:bg-brand-50 transition-colors border-b border-brand-100 ${isActive ? 'bg-brand-100/60 border-l-4 border-brand-600' : ''}">
            <div class="flex items-center justify-between mb-1">
              <span class="font-bold text-xs text-stone-900">${c.customerName}</span>
              <span class="text-[10px] text-stone-400">${lastMsg ? lastMsg.timestamp : ''}</span>
            </div>
            <div class="flex items-center justify-between gap-2">
              <p class="text-xs text-stone-500 truncate max-w-[160px]">${lastMsg ? lastMsg.text : 'No messages yet'}</p>
              <span class="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">${c.channel}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderChatStream() {
      const conv = conversations.find(c => c.id === activeConvId);
      const stream = document.getElementById("chat-stream");

      if (!conv) {
        if (stream) stream.innerHTML = `<div class="h-full flex items-center justify-center text-stone-400 text-xs">Select a conversation thread to view the live chat.</div>`;
        return;
      }

      const nameEl = document.getElementById("active-name");
      const phoneEl = document.getElementById("active-phone");
      const avatarEl = document.getElementById("active-avatar");
      const stageBadge = document.getElementById("active-stage-badge");

      if (nameEl) nameEl.textContent = conv.customerName || "Customer";
      if (phoneEl) phoneEl.textContent = conv.customerPhone;
      if (avatarEl) avatarEl.textContent = conv.customerName ? conv.customerName.replace(/[^a-zA-Z]/g, '').slice(0, 2).toUpperCase() : 'LQ';
      if (stageBadge) stageBadge.textContent = conv.stage;

      const toggleBtn = document.getElementById("ai-toggle-btn");
      const toggleLabel = document.getElementById("ai-toggle-label");
      if (toggleBtn && toggleLabel) {
        if (conv.isPaused) {
          toggleBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-rose-700 hover:bg-rose-800 text-white transition-all flex items-center gap-1.5 shadow-sm cursor-pointer";
          toggleLabel.textContent = "AI Paused (Manager Mode)";
        } else {
          toggleBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-700 hover:bg-emerald-800 text-white transition-all flex items-center gap-1.5 shadow-sm cursor-pointer";
          toggleLabel.textContent = "AI Responding";
        }
      }

      if (stream) {
        stream.innerHTML = conv.messages.map(m => {
          const isUser = m.role === 'user';
          return `
            <div class="flex ${isUser ? 'justify-start' : 'justify-end'} mb-2">
              <div class="max-w-[75%] p-3.5 rounded-2xl ${isUser ? 'bg-white border border-brand-200 text-stone-900 rounded-tl-none shadow-sm' : 'bg-brand-900 text-brand-50 rounded-tr-none shadow-md'} space-y-1">
                <p class="text-xs leading-relaxed whitespace-pre-wrap">${m.text}</p>
                <span class="text-[9px] block text-right ${isUser ? 'text-stone-400' : 'text-brand-300'}">${m.timestamp}</span>
              </div>
            </div>
          `;
        }).join('');

        stream.scrollTop = stream.scrollHeight;
      }
    }

    function selectConversation(id) {
      activeConvId = id;
      renderThreads();
      renderChatStream();
    }

    async function toggleAIPauseState() {
      const conv = conversations.find(c => c.id === activeConvId);
      if (!conv) return;

      const newStatus = !conv.isPaused;
      conv.isPaused = newStatus;
      renderChatStream();

      try {
        await fetch(`${BACKEND_URL}/conversations/toggle-pause`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-tenant-id': TENANT_ID
          },
          body: JSON.stringify({ customerId: conv.customerId, isPaused: newStatus })
        });
      } catch (err) {
        console.warn('AI pause updated locally:', err.message);
      }
    }

    async function handleSendMessage() {
      if (isSending) return;

      const input = document.getElementById("chat-input");
      if (!input || !input.value.trim()) return;

      let conv = conversations.find(c => c.id === activeConvId);
      if (!conv) {
        if (conversations.length > 0) {
          conv = conversations[0];
          activeConvId = conv.id;
        } else {
          return;
        }
      }

      const messageText = input.value.trim();
      input.value = "";
      isSending = true;

      conv.messages.push({
        role: "assistant",
        text: messageText,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      renderChatStream();
      renderThreads();

      try {
        await fetch(`${BACKEND_URL}/conversations/send-message`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-tenant-id': TENANT_ID
          },
          body: JSON.stringify({
            customerId: conv.customerId,
            text: messageText
          })
        });
      } catch (err) {
        console.error("Outbound send failed:", err.message);
      } finally {
        isSending = false;
      }
    }

    async function triggerTestInquiryUI() {
      const sampleQueries = [
        "Niaje! How much are the Air Force 1s?",
        "Do you have knotless braids available tomorrow?",
        "Can I pay via M-Pesa right now?",
        "Where is your luxury salon located in Nairobi?"
      ];

      const defaultText = sampleQueries[Math.floor(Math.random() * sampleQueries.length)];
      const userText = prompt("Enter customer WhatsApp inquiry to test AI bot live:", defaultText);
      if (!userText || !userText.trim()) return;

      let conv = conversations.find(c => c.id === activeConvId);
      if (!conv) {
        conv = conversations[0];
        activeConvId = conv.id;
      }

      // Add user message to UI immediately
      conv.messages.push({
        role: "user",
        text: userText.trim(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      renderChatStream();
      renderThreads();

      // Trigger server webhook to simulate live inbound WhatsApp message
      try {
        await fetch(`${BASE_ORIGIN}/api/webhook`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            entry: [{
              changes: [{
                value: {
                  metadata: { phone_number_id: "1279716021891578" },
                  messages: [{
                    id: `sim_${Date.now()}`,
                    from: conv.customerId,
                    type: 'text',
                    text: { body: userText.trim() }
                  }]
                }
              }]
            }]
          })
        });

        // Re-fetch conversations to render Gemini's sales reply
        setTimeout(fetchLiveConversations, 2500);
      } catch (err) {
        console.error("Simulation webhook error:", err.message);
      }
    }

    async function triggerQuickSTK() {
      const phoneEl = document.getElementById("active-phone");
      const phoneText = phoneEl ? phoneEl.textContent.replace(/[^0-9]/g, '') : '254768820142';
      const amount = prompt(`Enter M-Pesa amount (KSh) to dispatch STK push to +${phoneText}:`, "1");
      if (!amount) return;

      const btn = document.getElementById("quick-stk-btn");
      if (btn) btn.disabled = true;

      try {
        const res = await fetch(`${BACKEND_URL}/payments/test-stk`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-tenant-id': TENANT_ID
          },
          body: JSON.stringify({ testPhone: phoneText })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`✅ STK Push dispatched to +${phoneText}! Check your handset to enter PIN.`);
        } else {
          alert(`❌ STK Push error: ${data.message || 'Check credentials'}`);
        }
      } catch (err) {
        alert(`❌ Network error: ${err.message}`);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const items = document.querySelectorAll("#threads-container > div");
      items.forEach(el => {
        const text = el.innerText.toLowerCase();
        el.style.display = text.includes(q) ? "" : "none";
      });
    }

    function toggleMobileMenu() {
      const nav = document.getElementById("sidebarNav");
      const backdrop = document.getElementById("sidebarBackdrop");
      if (!nav || !backdrop) return;
      const isClosed = nav.classList.contains("-translate-x-full");
      if (isClosed) {
        nav.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        nav.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    // Expose directly to window
    window.triggerTestInquiryUI = triggerTestInquiryUI;
    window.fetchLiveConversations = fetchLiveConversations;
    window.selectConversation = selectConversation;
    window.toggleAIPauseState = toggleAIPauseState;
    window.handleSendMessage = handleSendMessage;
    window.triggerQuickSTK = triggerQuickSTK;
    window.handleSearch = handleSearch;
    window.toggleMobileMenu = toggleMobileMenu;

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
      fetchLiveConversations();
