<!DOCTYPE html>
<html lang="en" class="h-full bg-[#fbf9f5]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVON Q ORÉLUNE | Omnichannel Inbox</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind JavaScript Theme Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcfaf6',
              100: '#f5eee1',
              200: '#e7e2d8',
              500: '#a38446',
              600: '#8c7038',
              700: '#735b2c',
              900: '#1c1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- External Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full font-sans text-brand-900 antialiased flex flex-col md:flex-row overflow-hidden">

  <!-- Sidebar Navigation -->
  <!-- Sidebar Navigation -->
  <!-- Sidebar Navigation -->
<aside id="sidebarNav" class="fixed inset-y-0 left-0 z-40 w-64 bg-white/95 backdrop-blur-md border-r border-brand-200/50 flex flex-col justify-between p-6 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:w-64"></aside>  <div class="space-y-8">
    
    <!-- Clean Brand Logo (Image Only) -->
   <!-- Mobile Top Bar & Brand Logo -->
<div class="flex items-center justify-between md:justify-start">
  <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-14 md:h-20 w-auto object-contain" />
  
  <!-- Hamburger Button (Only visible on mobile screens) -->
  <button 
    type="button" 
    onclick="toggleMobileMenu()" 
    class="md:hidden p-2 text-slate-600 hover:text-brand-600 focus:outline-none"
    aria-label="Toggle Navigation"
  >
    <i data-lucide="menu" class="w-6 h-6"></i>
  </button>
</div>

    <!-- Navigation Links -->
    <nav class="space-y-1">
      <a href="index.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
      </a>
      <a href="catalog.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i> Catalog & Stock
      </a>
      <a href="inbox.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
        <i data-lucide="message-square" class="w-4 h-4"></i> Omnichannel Inbox
      </a>
      <a href="voice.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
        <i data-lucide="mic" class="w-4 h-4"></i> Voice & Persona
      </a>
      <a href="payments.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
        <i data-lucide="credit-card" class="w-4 h-4"></i> Daraja M-Pesa
      </a>
    </nav>
  </div>

  <!-- Bottom-Left Customer Sign-In / Active Tenant Access Card -->
  <!-- Bottom-Left Customer Sign-In / Portal Access Card -->
<div class="pt-6 border-t border-brand-200/60">
  <!-- Signed Out State (Sign In Button) -->
  <button 
    id="portalSignInBtn"
    onclick="openSignInModal()" 
    class="w-full p-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl flex items-center justify-center gap-2 font-medium text-sm transition-all shadow-md shadow-brand-600/20 cursor-pointer"
  >
    <i data-lucide="log-in" class="w-4 h-4"></i>
    <span>Sign In to Portal</span>
  </button>

  <!-- Signed In State (Active Tenant Display - Hidden by default) -->
  <div id="activeTenantCard" class="hidden p-3 bg-brand-50/80 backdrop-blur-sm rounded-xl border border-brand-200 flex items-center justify-between">
    <div class="flex items-center gap-3 overflow-hidden">
      <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">
        NK
      </div>
      <div class="overflow-hidden">
        <p class="text-xs font-semibold text-brand-900 truncate" id="tenantName">Nairobi Kicks Studio</p>
        <span class="inline-block px-1.5 py-0.5 text-[10px] font-semibold text-emerald-700 bg-emerald-100 rounded">Pro Tier</span>
      </div>
    </div>
    <button onclick="toggleSignOut()" class="text-slate-400 hover:text-rose-600 transition-colors p-1" title="Sign Out">
      <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
    </button>
  </div>
</div>
</aside>
  <!-- Main Inbox Container (Split View) -->
  <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden">
    
    <!-- Left Pane: Conversation Threads -->
    <section class="w-full md:w-80 bg-white border-r border-brand-200 flex flex-col h-full">
      <div class="p-4 border-b border-brand-200 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-serif font-bold text-lg text-brand-900">Conversations</h2>
          <span class="px-2 py-0.5 text-[10px] font-bold text-brand-700 bg-brand-100 rounded-full">3 Live</span>
        </div>
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" placeholder="Search phone or name..." class="w-full pl-8 pr-3 py-2 text-xs bg-brand-50 border border-brand-200 rounded-lg focus:outline-none focus:border-brand-600" />
        </div>
      </div>

      <!-- Thread Items -->
      <div id="threads-container" class="flex-1 overflow-y-auto divide-y divide-brand-200/60">
        <!-- Rendered dynamically by inbox.js -->
      </div>
    </section>

    <!-- Right Pane: Live Chat Stream -->
    <section class="flex-1 flex flex-col h-full bg-[#fbf9f5]">
      <!-- Chat Header Bar -->
      <div class="p-4 bg-white border-b border-brand-200 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
          <div id="active-avatar" class="w-10 h-10 rounded-full bg-brand-100 border border-brand-200 flex items-center justify-center font-bold text-brand-700 text-sm">
            FK
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 id="active-name" class="font-bold text-sm text-brand-900">Faith K.</h3>
              <span id="active-channel-badge" class="px-2 py-0.5 text-[9px] font-extrabold uppercase rounded bg-emerald-100 text-emerald-800">WhatsApp</span>
            </div>
            <p id="active-phone" class="text-xs text-slate-500">+254 712 987 654</p>
          </div>
        </div>

        <!-- Controls & Stage Badge -->
        <div class="flex items-center gap-3">
          <span id="active-stage-badge" class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider rounded-md bg-amber-100 text-amber-800 border border-amber-200">
            CLOSING
          </span>
          <button id="ai-toggle-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition-all flex items-center gap-1.5 shadow-sm">
            <i data-lucide="bot" class="w-3.5 h-3.5"></i>
            <span id="ai-toggle-label">AI Responding</span>
          </button>
        </div>
      </div>

      <!-- Chat Messages Scroll Area -->
      <div id="chat-stream" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Messages rendered dynamically by inbox.js -->
      </div>

      <!-- Message Input Form -->
      <div class="p-4 bg-white border-t border-brand-200">
        <form id="chat-form" class="flex items-center gap-2">
          <input type="text" id="chat-input" placeholder="Type a message or human override response..." class="flex-1 px-4 py-2.5 text-xs bg-brand-50 border border-brand-200 rounded-xl focus:outline-none focus:border-brand-600" />
          <button type="submit" class="px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold shadow transition-all flex items-center gap-1.5">
            <i data-lucide="send" class="w-3.5 h-3.5"></i> Send
          </button>
        </form>
      </div>
    </section>

  </main>
  <!-- Email/Password Auth Modal -->
<!-- Email/Password & Registration Auth Modal -->
<div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative border border-brand-100 animate-in fade-in zoom-in duration-200">
    
    <!-- Close Button -->
    <button type="button" onclick="closeSignInModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <!-- Modal Header -->
    <div class="text-center mb-4">
      <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-12 mx-auto mb-2 object-contain" />
      <h2 class="text-xl font-serif font-bold text-slate-900" id="authModalTitle">Sign in to Orélune OS</h2>
      <p class="text-xs text-slate-500 mt-1">Access developer sandboxes, M-Pesa test triggers & voice integration</p>
    </div>

    <!-- Mode Switcher Tabs -->
    <div class="flex border-b border-slate-100 mb-5 text-xs font-semibold">
      <button id="tabSignIn" type="button" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-center text-brand-600 border-b-2 border-brand-600 transition-all">
        Sign In
      </button>
      <button id="tabSignUp" type="button" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition-all">
        Create Account
      </button>
    </div>

    <!-- Authentication Form -->
    <form id="loginForm" onsubmit="handleCustomerAuth(event)" class="space-y-3.5">
      
      <!-- Full Name (Only visible during Sign Up) -->
      <div id="nameFieldGroup" class="hidden">
        <label for="fullName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name / Business Name</label>
        <input 
          type="text" 
          id="fullName" 
          placeholder="Nairobi Kicks Studio" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
        />
      </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="developer@studio.com" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
        />
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
        />
      </div>

      <!-- Sign-In Options (Remember / Forgot Password) -->
      <div id="signInOptions" class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
          <input type="checkbox" class="rounded border-slate-300 text-brand-600 focus:ring-brand-600" />
          <span>Remember me</span>
        </label>
        <a href="#" class="text-brand-600 hover:underline font-medium">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="authSubmitBtn"
        class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium text-sm transition-all shadow-md shadow-brand-600/20 cursor-pointer mt-2"
      >
        Authenticate Session
      </button>
    </form>
  </div>
</div>

  <script src="inbox.js"></script>
</body>
</html>
