<!DOCTYPE html>
<html lang="en" class="h-full bg-[#fbf9f5]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVON Q ORÉLUNE | Omnichannel Inbox</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind JavaScript Theme Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcfaf6',
              100: '#f5eee1',
              200: '#e7e2d8',
              500: '#a38446',
              600: '#8c7038',
              700: '#735b2c',
              900: '#1c1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- External Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- Mobile Top Header -->
  <header class="md:hidden bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30 w-full">
    <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-10 w-auto object-contain" />
    <button type="button" onclick="toggleMobileMenu()" class="p-2 text-slate-700 hover:text-brand-600 focus:outline-none">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
  </header>

  <!-- Mobile Backdrop Overlay -->
  <div id="sidebarBackdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Left Sidebar (ONLY LEFT SIDEBAR) -->
  <aside id="sidebarNav" class="fixed top-0 left-0 bottom-0 z-50 w-72 bg-white backdrop-blur-md border-r border-slate-200 flex flex-col justify-between p-6 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:w-64 flex-shrink-0">
    <div class="space-y-8">
      <div class="flex items-center justify-between">
        <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-12 w-auto object-contain" />
        <button type="button" onclick="toggleMobileMenu()" class="md:hidden text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <nav class="space-y-1">
        <a href="index.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
        </a>
        <a href="catalog.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> Catalog & Stock
        </a>
        <a href="inbox.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-brand-700 bg-brand-50 font-semibold flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm">
          <i data-lucide="message-square" class="w-4 h-4"></i> Omnichannel Inbox
        </a>
        <a href="voice.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="mic" class="w-4 h-4"></i> Voice & Persona
        </a>
        <a href="payments.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-all font-medium text-sm">
          <i data-lucide="credit-card" class="w-4 h-4"></i> Daraja M-Pesa
        </a>
      </nav>
    </div>

    <div class="pt-6 border-t border-slate-200">
      <button id="portalSignInBtn" onclick="openSignInModal()" class="w-full p-3 bg-brand-600 text-white rounded-xl flex items-center justify-center gap-2 font-medium text-sm shadow-md hover:bg-brand-700 transition-all">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Sign In to Portal</span>
      </button>
      
      <div id="activeTenantCard" class="hidden p-3 bg-brand-50 rounded-xl border border-brand-200 flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">NK</div>
          <div class="overflow-hidden">
            <p class="text-xs font-semibold text-brand-900 truncate" id="tenantName">Nairobi Kicks Studio</p>
            <span class="inline-block px-1.5 py-0.5 text-[10px] font-semibold text-emerald-700 bg-emerald-100 rounded">Pro Tier</span>
          </div>
        </div>
        <button onclick="toggleSignOut()" class="text-slate-400 hover:text-rose-600 p-1">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Split-View Container -->
  <main class="flex-1 flex flex-col md:flex-row h-screen overflow-hidden">
    
    <!-- 1. Left Conversation List Panel -->
    <div class="w-full md:w-80 border-r border-slate-200 bg-white flex flex-col h-full">
      <div class="p-4 border-b border-slate-200">
        <input type="text" placeholder="Search phone or name..." class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs" />
      </div>
      <div class="flex-1 overflow-y-auto">
        <!-- Chat items list -->
      </div>
    </div>

    <!-- 2. Right Active Chat Area -->
    <div class="flex-1 flex flex-col bg-slate-50 h-full">
      
      <!-- Chat Header -->
      <div class="p-4 bg-white border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center font-bold text-sm">FK</div>
          <div>
            <h3 class="font-semibold text-sm text-slate-800">Faith K.</h3>
            <p class="text-xs text-slate-500">+254 712 987 654</p>
          </div>
        </div>
      </div>

      <!-- Chat Messages Scrollable Box -->
      <div class="flex-1 p-4 overflow-y-auto space-y-4">
        <!-- Message Bubbles ONLY (No Sign In Button here!) -->
      </div>

      <!-- Chat Input Field -->
      <div class="p-4 bg-white border-t border-slate-200">
        <!-- Input field and send button -->
      </div>

    </div>

  </main>  <!-- Email/Password Auth Modal -->
<!-- Email/Password & Registration Auth Modal -->
<div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative border border-brand-100 animate-in fade-in zoom-in duration-200">
    
    <!-- Close Button -->
    <button type="button" onclick="closeSignInModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <!-- Modal Header -->
    <div class="text-center mb-4">
      <img src="Luvon q logo.png" alt="Luvon Q Logo" class="h-12 mx-auto mb-2 object-contain" />
      <h2 class="text-xl font-serif font-bold text-slate-900" id="authModalTitle">Sign in to Orélune OS</h2>
      <p class="text-xs text-slate-500 mt-1">Access developer sandboxes, M-Pesa test triggers & voice integration</p>
    </div>

    <!-- Mode Switcher Tabs -->
    <div class="flex border-b border-slate-100 mb-5 text-xs font-semibold">
      <button id="tabSignIn" type="button" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-center text-brand-600 border-b-2 border-brand-600 transition-all">
        Sign In
      </button>
      <button id="tabSignUp" type="button" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition-all">
        Create Account
      </button>
    </div>

    <!-- Authentication Form -->
    <form id="loginForm" onsubmit="handleCustomerAuth(event)" class="space-y-3.5">
      
      <!-- Full Name (Only visible during Sign Up) -->
      <div id="nameFieldGroup" class="hidden">
        <label for="fullName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name / Business Name</label>
        <input 
          type="text" 
          id="fullName" 
          placeholder="Nairobi Kicks Studio" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
        />
      </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="developer@studio.com" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
        />
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-all"
        />
      </div>

      <!-- Sign-In Options (Remember / Forgot Password) -->
      <div id="signInOptions" class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
          <input type="checkbox" class="rounded border-slate-300 text-brand-600 focus:ring-brand-600" />
          <span>Remember me</span>
        </label>
        <a href="#" class="text-brand-600 hover:underline font-medium">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="authSubmitBtn"
        class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium text-sm transition-all shadow-md shadow-brand-600/20 cursor-pointer mt-2"
      >
        Authenticate Session
      </button>
    </form>
  </div>
</div>

  <script src="inbox.js"></script>
</body>
</html>
